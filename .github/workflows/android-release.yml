name: Android release bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-upload.keystore

      - name: Create signing properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-upload.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Require release signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Android signing secrets are not configured. Add the four ANDROID_* repository secrets before building a Play upload." && exit 1)

      - name: Build signed App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pakhtoon-community-android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
