name: Android release bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Require release signing secrets
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release-upload.keystore

      - name: Validate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PREFERRED_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/release-upload.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "Unable to open the release keystore; check the Base64 file and keystore password." >&2
            exit 1
          fi
          key_alias="$PREFERRED_KEY_ALIAS"
          if [ -z "$key_alias" ] || ! keytool -list -keystore android/release-upload.keystore \
            -storepass "$STORE_PASSWORD" -alias "$key_alias" >/dev/null 2>&1; then
            key_alias="$(keytool -list -keystore android/release-upload.keystore -storepass "$STORE_PASSWORD" \
              | awk -F, '/PrivateKeyEntry/{print $1; exit}' | xargs)"
          fi
          test -n "$key_alias" || { echo "No private-key alias found in the release keystore." >&2; exit 1; }
          actual_sha1="$(keytool -list -v -keystore android/release-upload.keystore \
            -storepass "$STORE_PASSWORD" -alias "$key_alias" \
            | awk -F': ' '/SHA1:/{print $2; exit}')"
          test -n "$actual_sha1" || { echo "Could not read the keystore certificate fingerprint." >&2; exit 1; }
          echo "Using upload certificate SHA1: $actual_sha1"
          echo "KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Create signing properties
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release-upload.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: pakhtoon-community-android-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
