<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Pakhtoon Community | Oman Diaspora Portal</title>
    <meta name="description" content="Official community portal for the Pakhtoon diaspora in the Sultanate of Oman. Digital membership ID cards, executive cabinet, welfare claims, donations, and embassy coordination." />

    <!-- Open Graph / Facebook SEO -->

    <meta property="og:title" content="Pakhtoon Community | Oman Diaspora Portal" />
    <meta property="og:description" content="Official community portal for the Pakhtoon diaspora in Oman: digital membership ID, executive cabinet, welfare claims, and community support." />

    <!-- Google Structured Schema Data (JSON-LD) -->

        "@context": "https://schema.org",

        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+968 9911 1870",
          "contactType": "Community Welfare & Emergency Helpline",
          "availableLanguage": ["English", "Pashto", "Urdu", "Arabic"]
        }
      }
    </script>
  </head>
  <body class="bg-[#faf6ed] text-[#26302c] antialiased selection:bg-[#1b4d3e] selection:text-white">
